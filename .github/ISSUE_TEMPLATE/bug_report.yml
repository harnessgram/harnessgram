name: Bug report
description: Something does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste a bot token, a session string, a raw transcript or a private
        message.** A redacted example is enough. For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Harnessgram version
      description: Output of `harnessgram --version`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and Python version
      description: For example macOS 15 with Python 3.12, or Ubuntu 24.04 with Python 3.11.
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `harnessgram doctor`
      description: Remove anything private first (folder names, chat ids).
      render: text
