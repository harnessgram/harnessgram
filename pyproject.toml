[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessgram"
version = "0.2.0"
description = "Telegram remote control for Claude Code: one topic per session, voice, approvals, quota dashboard, translation."
authors = [{ name = "HarnessGram contributors" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["claude-code", "telegram", "remote-control", "hooks", "translation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
# Offline translation with Google TranslateGemma on Apple silicon (MLX).
mlx = ["mlx-lm; sys_platform == 'darwin'"]
# Offline translation with NLLB-200 (needs a converted CTranslate2 model dir).
nllb = ["ctranslate2", "sentencepiece"]
# Ed25519 signatures on answered control-panel decisions (decision_sign.py); without it answers stay unsigned.
sign = ["cryptography>=42"]
# APNs requires ES256 signing and an HTTP/2 transport, but the core stays standard-library only.
live-activity = ["cryptography>=42", "httpx[http2]>=0.27.2"]
# Live audio stays optional; the bridge's core remains standard-library only.
voice-copilot = ["websockets==15.0.1"]
mcp = ["mcp>=1.13,<2; python_version >= '3.10'"]
# Re-encodes an uploaded project picture (png, jpeg) to a square webp; without it only webp files are stored.
art = ["Pillow"]
test = ["pytest"]

# The public repository (the harnessgram organization).
[project.urls]
Homepage = "https://github.com/harnessgram/harnessgram"
Repository = "https://github.com/harnessgram/harnessgram"
Issues = "https://github.com/harnessgram/harnessgram/issues"
Changelog = "https://github.com/harnessgram/harnessgram/blob/main/CHANGELOG.md"

# `harnessgram` is the command; `lingoline` and `ctb` are aliases of it.
[project.scripts]
harnessgram = "ctb.cli:main"
lingoline = "ctb.cli:main"
ctb = "ctb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ctb" = ["cockpit_voice_copilot.css", "cockpit_voice_copilot.js", "cockpit_v2.css", "cockpit_v2.js", "cockpit_v2_screens.js", "cockpit_app_request.js", "cockpit_v2_knowledge.js", "cockpit_v2_knowledge.css", "cockpit_v2_addons.js", "cockpit_v2_addons.css", "cockpit_v2_packs.js", "cockpit_v2_packs.css", "cockpit_v2_schedule.js", "cockpit_v2_schedule.css", "cockpit_v2_workmap.js", "cockpit_v2_workmap.css", "cockpit_v2_family.js", "cockpit_v2_family.css", "cockpit_v2_art.js", "cockpit_v2_art.css", "cockpit_mac_tools.js", "cockpit_v2_strings.json", "assets/cockpit/*.webp", "assets/panel/*"]
"ctb.studio" = ["*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["new_install: use the real defaults and empty-state detection"]
